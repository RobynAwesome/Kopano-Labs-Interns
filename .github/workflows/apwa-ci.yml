name: APWA CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository governance
        run: node scripts/validate-governance.mjs

      - name: Prove malformed governance is rejected
        run: node --test tests/governance-validator.test.mjs

      - name: Validate pull request contract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-governance.mjs --pr-env

      - name: Validate visual system contract
        run: node scripts/validate-visual-system.mjs

      - name: Prove malformed visual systems are rejected
        run: node --test tests/visual-system-contract.test.mjs

      - name: Validate spatial model semantics
        run: node --test tests/spatial-model.test.mjs

      - name: Validate world navigation contract
        run: node --test tests/world-navigation.test.mjs

      - name: Validate adaptive render policy
        run: node --test tests/adaptive-render-policy.test.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Enforce spatial bundle budgets
        shell: bash
        run: |
          mkdir -p proof
          node scripts/check-spatial-budgets.mjs | tee proof/spatial-budget-proof.json
          grep -q '"verdict": "pass"' proof/spatial-budget-proof.json

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > proof/preview.log 2>&1 &
          echo $! > proof/preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat proof/preview.log
          exit 1

      - name: Verify PWA static surfaces
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4173/manifest.webmanifest > proof/manifest.webmanifest
          curl --fail --silent --show-error http://127.0.0.1:4173/sw.js > proof/sw.js
          grep -q '"display"' proof/manifest.webmanifest
          grep -q 'standalone' proof/manifest.webmanifest
          grep -q 'fetch' proof/sw.js

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser exists on this runner" >&2
            exit 1
          fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee proof/chromium-version.txt

      - name: Receipt adaptive tier and fallback matrix
        shell: bash
        run: |
          ADAPT_PID=""
          cleanup() {
            if [ -n "$ADAPT_PID" ]; then
              kill "$ADAPT_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9223 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/kopano-adaptive-proof \
            --window-size=1200,900 \
            about:blank > proof/adaptive-browser.log 2>&1 &
          ADAPT_PID=$!

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:9223/json/version > proof/adaptive-debugger.json; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:9223/json/version > /dev/null

          node scripts/prove-adaptive-runtime.mjs http://127.0.0.1:9223 http://127.0.0.1:4173 > proof/adaptive-runtime-proof.json
          grep -q '"verdict": "pass"' proof/adaptive-runtime-proof.json
          grep -q '"name": "full"' proof/adaptive-runtime-proof.json
          grep -q '"name": "balanced"' proof/adaptive-runtime-proof.json
          grep -q '"name": "lite-low-device"' proof/adaptive-runtime-proof.json
          grep -q '"name": "save-data"' proof/adaptive-runtime-proof.json
          grep -q '"name": "reduced-motion"' proof/adaptive-runtime-proof.json
          grep -q '"name": "offline-signal"' proof/adaptive-runtime-proof.json
          grep -q '"name": "webgl-unavailable"' proof/adaptive-runtime-proof.json

          cleanup
          trap - EXIT

      - name: Receipt canonical district deep links
        shell: bash
        run: |
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/kopano-deeplink \
            --window-size=1200,900 \
            --virtual-time-budget=5000 \
            --dump-dom \
            'http://127.0.0.1:4173/?lane=opportunity' > proof/deeplink-opportunity.html

          grep -q 'data-active-lane="opportunity"' proof/deeplink-opportunity.html
          grep -q 'data-camera-lane="opportunity"' proof/deeplink-opportunity.html
          grep -q 'data-spatial-renderer="webgl"' proof/deeplink-opportunity.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --force-prefers-reduced-motion=reduce \
            --user-data-dir=/tmp/kopano-deeplink-lite \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --dump-dom \
            'http://127.0.0.1:4173/?lane=opportunity' > proof/deeplink-opportunity-lite.html

          grep -q 'data-active-lane="opportunity"' proof/deeplink-opportunity-lite.html
          grep -q 'data-spatial-renderer="static"' proof/deeplink-opportunity-lite.html
          grep -q 'data-spatial-fallback-reason="reduced-motion"' proof/deeplink-opportunity-lite.html
          grep -q 'data-spatial-node="learn"' proof/deeplink-opportunity-lite.html
          grep -q 'data-spatial-node="opportunity"' proof/deeplink-opportunity-lite.html

      - name: Receipt browser Back Forward and anchor semantics
        shell: bash
        run: |
          NAV_PID=""
          cleanup() {
            if [ -n "$NAV_PID" ]; then
              kill "$NAV_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/kopano-world-nav \
            --window-size=1200,900 \
            'http://127.0.0.1:4173/?lane=learn' > proof/navigation-browser.log 2>&1 &
          NAV_PID=$!

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:9222/json/version > proof/navigation-debugger.json; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:9222/json/version > /dev/null

          node scripts/prove-world-navigation.mjs http://127.0.0.1:9222 http://127.0.0.1:4173 > proof/navigation-proof.json
          grep -q '"verdict": "pass"' proof/navigation-proof.json
          grep -q '"name": "back"' proof/navigation-proof.json
          grep -q '"name": "forward"' proof/navigation-proof.json
          grep -q '"name": "anchor-pathways"' proof/navigation-proof.json

          cleanup
          trap - EXIT

      - name: Receipt desktop browser runtime
        shell: bash
        run: |
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/kopano-desktop \
            --window-size=1440,1000 \
            --virtual-time-budget=5000 \
            --log-net-log=proof/desktop-netlog.json \
            --screenshot=proof/desktop.png \
            http://127.0.0.1:4173/

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/kopano-desktop-dom \
            --window-size=1440,1000 \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/ > proof/desktop.html

          grep -q 'Learn enough to move.' proof/desktop.html
          grep -q 'Learning Network' proof/desktop.html
          grep -q 'data-active-lane="learn"' proof/desktop.html
          grep -q 'data-spatial-renderer="webgl"' proof/desktop.html
          grep -q 'data-camera-lane="learn"' proof/desktop.html
          test -s proof/desktop.png

      - name: Receipt mobile browser runtime
        shell: bash
        run: |
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/kopano-mobile \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --screenshot=proof/mobile.png \
            http://127.0.0.1:4173/

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/kopano-mobile-dom \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/ > proof/mobile.html

          grep -q 'Mobile learning world' proof/mobile.html
          grep -q 'Learn enough to move.' proof/mobile.html
          grep -q 'data-active-lane="learn"' proof/mobile.html
          test -s proof/mobile.png

      - name: Receipt reduced-motion lite runtime
        shell: bash
        run: |
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --force-prefers-reduced-motion=reduce \
            --user-data-dir=/tmp/kopano-lite \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --log-net-log=proof/lite-netlog.json \
            --screenshot=proof/mobile-lite.png \
            http://127.0.0.1:4173/

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --force-prefers-reduced-motion=reduce \
            --user-data-dir=/tmp/kopano-lite-dom \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/ > proof/mobile-lite.html

          grep -q '>lite</span>' proof/mobile-lite.html
          grep -q 'data-active-lane="learn"' proof/mobile-lite.html
          grep -q 'data-spatial-renderer="static"' proof/mobile-lite.html
          grep -q 'data-spatial-budget="lite"' proof/mobile-lite.html
          grep -q 'data-spatial-fallback-reason="reduced-motion"' proof/mobile-lite.html
          grep -q 'data-spatial-node="learn"' proof/mobile-lite.html
          grep -q 'data-spatial-node="opportunity"' proof/mobile-lite.html
          if grep -q 'HeavyWorld-' proof/lite-netlog.json; then
            echo 'FOC: lite/reduced-motion path requested the heavy Three.js chunk' >&2
            exit 1
          fi
          test -s proof/mobile-lite.png

      - name: Write exact-head proof receipt
        shell: bash
        run: |
          {
            echo "schema=s1_pc_adaptive_3d_hardening_v1"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "merge_test_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "governance_repository=pass"
            echo "governance_negative_tests=pass"
            echo "governance_pr_contract=pass"
            echo "visual_system_contract=pass"
            echo "visual_system_negative_tests=pass"
            echo "spatial_model_tests=pass"
            echo "world_navigation_unit_tests=pass"
            echo "adaptive_render_policy_tests=pass"
            echo "spatial_bundle_budget=pass"
            echo "adaptive_runtime_matrix=pass"
            echo "full_webgl=pass"
            echo "balanced_webgl=pass"
            echo "lite_static=pass"
            echo "save_data_static=pass"
            echo "reduced_motion_static=pass"
            echo "offline_static=pass"
            echo "webgl_unavailable_static=pass"
            echo "constrained_heavy_chunk_requested=false"
            echo "canonical_deeplink_webgl=pass"
            echo "canonical_deeplink_lite=pass"
            echo "browser_back_forward=pass"
            echo "anchor_preserves_lane=pass"
            echo "camera_lane_binding=pass"
            echo "desktop=pass"
            echo "mobile=pass"
            echo "reduced_motion_lite=pass"
            echo "manifest_reachable=pass"
            echo "service_worker_script_reachable=pass"
            echo "external_deployed_preview=not_proven_by_this_workflow"
          } > proof/receipt.txt

      - name: Export governed APWA validation artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: s1-pc-adaptive-3d-proof-${{ github.event.pull_request.head.sha }}
          path: |
            proof
            dist
            package-lock.json
            governance/visual-system
            src/spatial
            src/lib/adaptive.js
            src/components/AdaptiveWorld.jsx
            scripts/prove-world-navigation.mjs
            scripts/prove-adaptive-runtime.mjs
            scripts/check-spatial-budgets.mjs
          if-no-files-found: error
          retention-days: 14
