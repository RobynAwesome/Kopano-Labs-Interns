name: APWA CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Export validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: s0-pa-validation
          path: |
            dist
            package-lock.json
          if-no-files-found: error
          retention-days: 7
